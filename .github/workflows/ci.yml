name: CI

on:
  push:
    branches:
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          # The step below caches ~/.npm with a fallback key; setup-node's own cache has none.
          package-manager-cache: false

      # npm's download cache, including prebuilt native binaries (~/.npm/_prebuilds),
      # so a failed GitHub release download doesn't fail `npm ci`. The fallback key
      # restores the newest cache when the lockfile changes.
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      # Pilot only: rc releases accept the owner-approved permission deferral;
      # drop the switch at vmethod 1.0, where it is rejected (vmethod#60).
      - name: Methodology check
        run: npm exec --no -- vmethod check --defer-permissions

      - name: Changelog fragments
        run: |
          scripts/agent/check-changelog.sh
          scripts/tests/changelog.test.sh
          scripts/tests/markdown.test.sh
          node --test scripts/tests/format-worktrees.test.mjs

      - name: Run tests
        run: npm run test

      - name: Methodology adoption and project hooks (offline)
        run: |
          node --test scripts/tests/vmethod-adoption.test.mjs
          bash scripts/tests/deps-after-fast-forward.test.sh

      - name: Release publication verification tests (offline)
        run: bash scripts/tests/release-publish.test.sh

      - name: Beta publication tests (offline)
        run: |
          node --test scripts/tests/beta-versions.test.mjs
          bash scripts/tests/publish-beta.test.sh

      - name: Build
        run: npm run build

      - name: Clean workspace
        if: always()
        run: git clean -ffdx
