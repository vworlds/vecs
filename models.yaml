# Model families match the shared board. Owner fallback: sol → glm → big-pickle.
# price: API list rates in USD per million tokens { input, output, cached }.
# opencode families copy vmethod's models.yaml at v1.0.0-rc.3 (OpenRouter rates
# fetched 2026-10-18; big-pickle is the vmethod owner's 90% of glm-5.3). Claude
# families run through OpenCode's claude-code provider, which reports cost 0, so
# their cost comes from these prices: Anthropic's first-party API rates as of
# 2026-10-06.
- family: sol
  model: codexbal/gpt-6.1-sol
  price: { input: 2.0, output: 10.0, cached: 0.1 }
  tiers: [{ minPrompt: 272000, input: 4.0, output: 15.0, cached: 0.2 }]
  kind: opencode
  gate: none
  tier: standard
  fallback: [glm, big-pickle]
- family: luna
  model: codexbal/gpt-6-luna
  price: { input: 0.1, output: 0.5, cached: 0.01 }
  tiers: [{ minPrompt: 272000, input: 0.2, output: 0.75, cached: 0.02 }]
  kind: opencode
  gate: none
  tier: standard
- family: astra
