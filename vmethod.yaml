repo: vworlds/vecs
org: vworlds
baseBranch: dev
releaseBranch: master
workerUser: jm
stateName: vecs
legacyState: [vecs-watch]
legacyWorkers:
  - vecs-orchestrator/workers
  - vecs-orchestrator/claude-workers
vmethod:
  repo: vworlds/vmethod
watch:
  preview: false
branches:
  taskPattern: "<number>-<slug>"
  worktreeRoot: .worktrees
  worktreePrefix: auto-
  mainCheckout: /home/jm/src/vecs
  packPrefix: pack/
  trackPrefix: track/
board:
  enabled: true
  owner: vworlds
  number: 4
  repos: [vworlds/vecs, vworlds/spacerocks]
learningsPrivacy: public
# Bugs with a reproducer skip owner scope approval, as before vmethod; they
# still need a SCOPE REVIEW, and delivery approval is unchanged.
scope:
  fastPath: [bug]
push: {}
checks:
  verify:
    - npm run typecheck
    - npm run lint
    - npm run format:check
    - npm run test
    - npm run build
  release: [npm run build]
  docsGlob: "{architecture,lib,apps}/**/*.md"
  ci: [CI]
postMerge:
  install: HUSKY=0 npm ci --no-audit --no-fund
  trigger: package-lock.json
merge:
  # Owner decision, 2026-10-17 (vmethod#8; PR #370).
  requireCurrentBase: false
changelog:
  directory: architecture/unreleased
  kinds: [Added, Changed, Fixed, Removed, Docs, Tests, Internal]
credentials:
  githubToken: GH_TOKEN
  sshKey: VMETHOD_SSH_KEY
  workerPassword: OPENCODE_SERVER_PASSWORD
  workerGithubToken: CLAUDE_WORKER_GH_TOKEN
